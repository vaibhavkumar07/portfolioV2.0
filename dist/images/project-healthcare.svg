    <circle cx="8" cy="74" r="4" fill="#0084d6" opacity="0.8"/>
    <text x="20" y="78" font-family="monospace" font-size="9" fill="#8892a4">Predictive Routing</text>
    <circle cx="8" cy="96" r="4" fill="#00c853" opacity="0.8"/>
    <text x="20" y="100" font-family="monospace" font-size="9" fill="#8892a4">Power Automate Flow</text>
    <circle cx="8" cy="118" r="4" fill="#ff4f1f" opacity="0.8"/>
    <text x="20" y="122" font-family="monospace" font-size="9" fill="#8892a4">Moveworks Bot</text>
    <circle cx="8" cy="140" r="4" fill="#0084d6" opacity="0.8"/>
    <text x="20" y="144" font-family="monospace" font-size="9" fill="#8892a4">CRM Integration</text>
    <circle cx="8" cy="162" r="4" fill="#00c853" opacity="0.8"/>
    <text x="20" y="166" font-family="monospace" font-size="9" fill="#8892a4">Dialogflow NLU</text>
  </g>
  <!-- Waveform -->
  <g transform="translate(330, 315)" opacity="0.6">
    <text x="0" y="-8" font-family="monospace" font-size="8" fill="#4a6890" letter-spacing="1">VOICE WAVEFORM</text>
    <polyline points="0,30 10,20 20,35 30,10 40,25 50,15 60,30 70,8 80,28 90,18 100,32 110,12 120,26 130,20 140,30 150,10 160,28"
