  </g>
  <!-- Genesys Cloud panel -->
  <rect x="560" y="60" width="200" height="200" rx="3" fill="none" stroke="#0084d6" stroke-width="1" opacity="0.4"/>
  <rect x="560" y="60" width="200" height="200" rx="3" fill="#0084d6" fill-opacity="0.03"/>
  <text x="660" y="84" font-family="monospace" font-size="9" fill="#0084d6" text-anchor="middle" letter-spacing="2">GENESYS CLOUD CX</text>
  <line x1="560" y1="93" x2="760" y2="93" stroke="#0084d6" stroke-width="0.5" opacity="0.3"/>
  <!-- Stats -->
  <g transform="translate(580, 110)">
    <text x="0" y="0" font-family="monospace" font-size="22" fill="#ff4f1f" font-weight="bold">40%</text>
    <text x="0" y="16" font-family="monospace" font-size="8" fill="#4a6890">HANDLE TIME REDUCTION</text>
    <text x="0" y="50" font-family="monospace" font-size="22" fill="#00c853" font-weight="bold">95%</text>
    <text x="0" y="66" font-family="monospace" font-size="8" fill="#4a6890">CSAT IMPROVEMENT</text>
    <text x="0" y="100" font-family="monospace" font-size="22" fill="#0084d6" font-weight="bold">24/7</text>
    <text x="0" y="116" font-family="monospace" font-size="8" fill="#4a6890">AI BOT AVAILABILITY</text>
  </g>
  <!-- Corner brackets -->
  <g stroke="#ff4f1f" stroke-width="1.5" fill="none" opacity="0.5">
    <polyline points="10,10 10,30 30,30"/>
    <polyline points="790,10 790,30 770,30"/>
    <polyline points="10,490 10,470 30,470"/>
    <polyline points="790,490 790,470 770,470"/>
  </g>
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="30" fill="#ff4f1f" fill-opacity="0.07"/>
  <text x="20" y="19" font-family="monospace" font-size="9" fill="#ff4f1f" letter-spacing="2">RESULT-001</text>
  <text x="400" y="19" font-family="monospace" font-size="9" fill="#4a6890" text-anchor="middle" letter-spacing="1">CONTACT CENTER MODERNIZATION · HEALTHCARE</text>
  <circle cx="770" cy="15" r="5" fill="#00c853" opacity="0.8"/>
  <text x="780" y="19" font-family="monospace" font-size="8" fill="#00c853">LIVE</text>
