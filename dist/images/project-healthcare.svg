  <rect x="20" y="280" width="80" height="40" rx="2" fill="#00c853" fill-opacity="0.07"/>
  <text x="60" y="296" font-family="monospace" font-size="8" fill="#00c853" text-anchor="middle">PRESS 1</text>
  <text x="60" y="309" font-family="monospace" font-size="8" fill="#8892a4" text-anchor="middle">APPOINTMENT</text>
  <!-- Press 2 node -->
  <rect x="85" y="280" width="80" height="40" rx="2" fill="none" stroke="#00c853" stroke-width="1" opacity="0.7"/>
  <rect x="85" y="280" width="80" height="40" rx="2" fill="#00c853" fill-opacity="0.07"/>
