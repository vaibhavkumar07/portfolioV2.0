  <text x="125" y="309" font-family="monospace" font-size="8" fill="#8892a4" text-anchor="middle">BILLING</text>
  <!-- Press 3 node -->
  <rect x="155" y="280" width="80" height="40" rx="2" fill="none" stroke="#00c853" stroke-width="1" opacity="0.7"/>
  <rect x="155" y="280" width="80" height="40" rx="2" fill="#00c853" fill-opacity="0.07"/>
  <text x="195" y="296" font-family="monospace" font-size="8" fill="#00c853" text-anchor="middle">PRESS 3</text>
  <text x="195" y="309" font-family="monospace" font-size="8" fill="#8892a4" text-anchor="middle">SPECIALIST</text>
  <!-- AI/ML processing panel -->
  <rect x="310" y="60" width="200" height="380" rx="3" fill="none" stroke="#ff4f1f" stroke-width="1" opacity="0.3"/>
  <rect x="310" y="60" width="200" height="380" rx="3" fill="#ff4f1f" fill-opacity="0.03"/>
  <text x="410" y="85" font-family="monospace" font-size="9" fill="#ff4f1f" text-anchor="middle" letter-spacing="2">AI STUDIO ENGINE</text>
  <line x1="310" y1="95" x2="510" y2="95" stroke="#ff4f1f" stroke-width="0.5" opacity="0.3"/>
