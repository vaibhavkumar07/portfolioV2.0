<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810"/>
      <stop offset="100%" style="stop-color:#0a0f1a"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#ff4f1f" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="80" y1="0" x2="80" y2="500"/><line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/><line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
  </g>
  <!-- IVR Flow nodes -->
  <!-- Incoming Call node -->
  <rect x="60" y="80" width="130" height="50" rx="2" fill="none" stroke="#ff4f1f" stroke-width="1.5" opacity="0.8"/>
  <rect x="60" y="80" width="130" height="50" rx="2" fill="#ff4f1f" fill-opacity="0.08"/>
  <text x="125" y="101" font-family="monospace" font-size="9" fill="#ff4f1f" text-anchor="middle" letter-spacing="1">INCOMING CALL</text>
  <text x="125" y="118" font-family="monospace" font-size="11" fill="#eaeaf2" text-anchor="middle">📞 PATIENT LINE</text>
  <!-- Arrow down -->
  <line x1="125" y1="130" x2="125" y2="165" stroke="#ff4f1f" stroke-width="1.5" opacity="0.6"/>
  <polygon points="125,170 120,160 130,160" fill="#ff4f1f" opacity="0.6"/>
  <!-- IVR Welcome node -->
  <rect x="60" y="170" width="130" height="50" rx="2" fill="none" stroke="#0084d6" stroke-width="1.5" opacity="0.8"/>
  <rect x="60" y="170" width="130" height="50" rx="2" fill="#0084d6" fill-opacity="0.08"/>
  <text x="125" y="192" font-family="monospace" font-size="9" fill="#0084d6" text-anchor="middle" letter-spacing="1">IVR WELCOME</text>
  <text x="125" y="208" font-family="monospace" font-size="10" fill="#eaeaf2" text-anchor="middle">AI GREETING</text>
  <!-- Branches -->
  <line x1="125" y1="220" x2="125" y2="255" stroke="#0084d6" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="255" x2="60" y2="255" stroke="#0084d6" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="255" x2="195" y2="255" stroke="#0084d6" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="255" x2="60" y2="280" stroke="#0084d6" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="255" x2="125" y2="280" stroke="#0084d6" stroke-width="1" opacity="0.5"/>
  <line x1="195" y1="255" x2="195" y2="280" stroke="#0084d6" stroke-width="1" opacity="0.5"/>
  <!-- Press 1 node -->
