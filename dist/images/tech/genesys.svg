<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#050810"/>
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="rgba(255,79,31,0.25)" stroke-width="1"/>
  <!-- Circuit nodes corners -->
  <circle cx="8" cy="8" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="248" cy="8" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="8" cy="248" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="248" cy="248" r="3" fill="rgba(255,79,31,0.4)"/>
  <!-- Label -->
  <text x="128" y="30" font-family="monospace" font-size="9" fill="rgba(255,79,31,0.5)" text-anchor="middle" letter-spacing="3">GENESYS CLOUD</text>
  <!-- G letter as main icon -->
  <g transform="translate(128,135)">
    <!-- Outer ring -->
    <circle r="68" fill="none" stroke="#ff4f1f" stroke-width="2.5" opacity="0.15"/>
    <circle r="54" fill="none" stroke="#ff4f1f" stroke-width="1.5" opacity="0.25"/>
    <!-- G shape -->
    <path d="M30,-12 A54,54 0 1,0 54,0 L30,0 L30,-12" fill="none" stroke="#ff4f1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="8" y1="0" x2="54" y2="0" stroke="#ff4f1f" stroke-width="5" stroke-linecap="round"/>
    <!-- Glow dot at center -->
    <circle r="6" fill="#ff4f1f" opacity="0.9"/>
    <circle r="3" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Bottom label -->
  <text x="128" y="232" font-family="monospace" font-size="8" fill="rgba(255,79,31,0.4)" text-anchor="middle" letter-spacing="2">CX PLATFORM</text>
