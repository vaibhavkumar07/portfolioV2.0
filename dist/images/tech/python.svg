<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#050810"/>
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="rgba(0,132,214,0.3)" stroke-width="1"/>
  <circle cx="8" cy="8" r="3" fill="rgba(0,132,214,0.5)"/>
  <circle cx="248" cy="8" r="3" fill="rgba(0,132,214,0.5)"/>
  <circle cx="8" cy="248" r="3" fill="rgba(0,132,214,0.5)"/>
  <circle cx="248" cy="248" r="3" fill="rgba(0,132,214,0.5)"/>
  <text x="128" y="30" font-family="monospace" font-size="9" fill="rgba(0,132,214,0.6)" text-anchor="middle" letter-spacing="3">PYTHON</text>
  <!-- Python P letter with snake detail -->
  <g transform="translate(128,128)">
    <!-- P letter main shape -->
    <rect x="-30" y="-62" width="16" height="124" rx="4" fill="#0084d6" fill-opacity="0.2" stroke="#0084d6" stroke-width="2.5"/>
    <!-- P bump -->
    <path d="M-14,-62 Q42,-62 42,-28 Q42,6 -14,6" fill="none" stroke="#0084d6" stroke-width="2.5"/>
    <!-- P inner fill -->
    <path d="M-14,-48 Q28,-48 28,-28 Q28,-8 -14,-8" fill="#0084d6" fill-opacity="0.12" stroke="none"/>
    <!-- Snake coil hint -->
    <path d="M18,28 Q50,28 50,50 Q50,72 18,72 Q-14,72 -14,90" fill="none" stroke="#ffcc00" stroke-width="2" stroke-dasharray="3,2" opacity="0.7"/>
    <circle cx="-14" cy="90" r="5" fill="#ffcc00" opacity="0.7"/>
    <!-- Snake eye -->
    <circle cx="50" cy="50" r="3.5" fill="#ffcc00" opacity="0.7"/>
    <!-- Outer ring -->
    <circle r="70" fill="none" stroke="#0084d6" stroke-width="1" opacity="0.1"/>
  </g>
  <text x="128" y="232" font-family="monospace" font-size="8" fill="rgba(0,132,214,0.4)" text-anchor="middle" letter-spacing="2">AUTOMATION · CRON</text>
</svg>
