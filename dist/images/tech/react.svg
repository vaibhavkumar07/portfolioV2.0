<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#050810"/>
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="rgba(0,200,83,0.2)" stroke-width="1"/>
  <circle cx="8" cy="8" r="3" fill="rgba(0,200,83,0.4)"/>
  <circle cx="248" cy="8" r="3" fill="rgba(0,200,83,0.4)"/>
  <circle cx="8" cy="248" r="3" fill="rgba(0,200,83,0.4)"/>
  <circle cx="248" cy="248" r="3" fill="rgba(0,200,83,0.4)"/>
  <text x="128" y="30" font-family="monospace" font-size="9" fill="rgba(0,200,83,0.5)" text-anchor="middle" letter-spacing="3">REACT JS</text>
  <!-- React atom logo -->
  <g transform="translate(128,128)">
    <!-- 3 elliptical orbits -->
    <ellipse rx="72" ry="28" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.8"/>
    <ellipse rx="72" ry="28" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.8" transform="rotate(60)"/>
    <ellipse rx="72" ry="28" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.8" transform="rotate(120)"/>
    <!-- Electrons on orbits -->
    <circle cx="72" cy="0" r="5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="-36" cy="62" r="5" fill="#00d4ff" opacity="0.9" transform="rotate(60) translate(72,0) rotate(-60)"/>
    <circle cx="-36" cy="-62" r="5" fill="#00d4ff" opacity="0.9" transform="rotate(120) translate(72,0) rotate(-120)"/>
    <!-- Nucleus -->
    <circle r="12" fill="#00d4ff" fill-opacity="0.2" stroke="#00d4ff" stroke-width="2" opacity="0.9"/>
    <circle r="5" fill="#00d4ff" opacity="0.95"/>
  </g>
  <text x="128" y="232" font-family="monospace" font-size="8" fill="rgba(0,200,83,0.4)" text-anchor="middle" letter-spacing="2">SPA · UI FRAMEWORK</text>
</svg>
