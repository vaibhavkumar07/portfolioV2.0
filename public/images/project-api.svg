<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810"/>
      <stop offset="100%" style="stop-color:#0a0f1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <!-- Grid -->
  <g opacity="0.05" stroke="#00c853" stroke-width="0.5">
    <line x1="0" y1="62.5" x2="800" y2="62.5"/><line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="187.5" x2="800" y2="187.5"/><line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="312.5" x2="800" y2="312.5"/><line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="0" y1="437.5" x2="800" y2="437.5"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="30" fill="#00c853" fill-opacity="0.06"/>
  <text x="20" y="19" font-family="monospace" font-size="9" fill="#00c853" letter-spacing="2">RESULT-003</text>
  <text x="400" y="19" font-family="monospace" font-size="9" fill="#4a6890" text-anchor="middle" letter-spacing="1">API INTEGRATION FRAMEWORK · AUTOMOTIVE</text>
  <!-- Central API Hub -->
  <rect x="300" y="185" width="200" height="130" rx="3" fill="none" stroke="#ff4f1f" stroke-width="2" opacity="0.9"/>
  <rect x="300" y="185" width="200" height="130" rx="3" fill="#ff4f1f" fill-opacity="0.08"/>
  <text x="400" y="212" font-family="monospace" font-size="10" fill="#ff4f1f" text-anchor="middle" letter-spacing="2">API GATEWAY</text>
  <line x1="300" y1="222" x2="500" y2="222" stroke="#ff4f1f" stroke-width="0.5" opacity="0.4"/>
  <text x="400" y="242" font-family="monospace" font-size="9" fill="#eaeaf2" text-anchor="middle">Java · Spring Boot</text>
  <text x="400" y="258" font-family="monospace" font-size="8" fill="#8892a4" text-anchor="middle">REST + SOAP</text>
  <text x="400" y="275" font-family="monospace" font-size="8" fill="#8892a4" text-anchor="middle">Auth · Rate Limit · Log</text>
  <text x="400" y="295" font-family="monospace" font-size="8" fill="#4a6890" text-anchor="middle">50+ Endpoints</text>
  <!-- Left nodes -->
  <!-- REST Client -->
  <rect x="60" y="80" width="130" height="55" rx="2" fill="none" stroke="#0084d6" stroke-width="1.5" opacity="0.8"/>
  <rect x="60" y="80" width="130" height="55" rx="2" fill="#0084d6" fill-opacity="0.07"/>
  <text x="125" y="100" font-family="monospace" font-size="8" fill="#0084d6" text-anchor="middle" letter-spacing="1">REST CLIENT</text>
  <text x="125" y="118" font-family="monospace" font-size="10" fill="#eaeaf2" text-anchor="middle" font-weight="bold">HTTP/JSON</text>
  <line x1="190" y1="107" x2="298" y2="220" stroke="#0084d6" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- SOAP Client -->
  <rect x="60" y="220" width="130" height="55" rx="2" fill="none" stroke="#0084d6" stroke-width="1.5" opacity="0.8"/>
  <rect x="60" y="220" width="130" height="55" rx="2" fill="#0084d6" fill-opacity="0.07"/>
  <text x="125" y="240" font-family="monospace" font-size="8" fill="#0084d6" text-anchor="middle" letter-spacing="1">SOAP SERVICE</text>
  <text x="125" y="258" font-family="monospace" font-size="10" fill="#eaeaf2" text-anchor="middle" font-weight="bold">XML/WSDL</text>
  <line x1="190" y1="247" x2="298" y2="250" stroke="#0084d6" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- Spring client -->
  <rect x="60" y="360" width="130" height="55" rx="2" fill="none" stroke="#0084d6" stroke-width="1.5" opacity="0.8"/>
  <rect x="60" y="360" width="130" height="55" rx="2" fill="#0084d6" fill-opacity="0.07"/>
  <text x="125" y="380" font-family="monospace" font-size="8" fill="#0084d6" text-anchor="middle" letter-spacing="1">MICROSERVICE</text>
  <text x="125" y="398" font-family="monospace" font-size="10" fill="#eaeaf2" text-anchor="middle" font-weight="bold">Spring Boot</text>
  <line x1="190" y1="387" x2="298" y2="295" stroke="#0084d6" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- Right nodes -->
  <!-- MySQL -->
  <rect x="610" y="80" width="130" height="55" rx="2" fill="none" stroke="#00c853" stroke-width="1.5" opacity="0.8"/>
  <rect x="610" y="80" width="130" height="55" rx="2" fill="#00c853" fill-opacity="0.07"/>
  <text x="675" y="100" font-family="monospace" font-size="8" fill="#00c853" text-anchor="middle" letter-spacing="1">MYSQL DB</text>
  <text x="675" y="118" font-family="monospace" font-size="10" fill="#eaeaf2" text-anchor="middle" font-weight="bold">Relational</text>
  <line x1="502" y1="220" x2="608" y2="107" stroke="#00c853" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- MongoDB -->
  <rect x="610" y="220" width="130" height="55" rx="2" fill="none" stroke="#00c853" stroke-width="1.5" opacity="0.8"/>
  <rect x="610" y="220" width="130" height="55" rx="2" fill="#00c853" fill-opacity="0.07"/>
  <text x="675" y="240" font-family="monospace" font-size="8" fill="#00c853" text-anchor="middle" letter-spacing="1">MONGODB</text>
  <text x="675" y="258" font-family="monospace" font-size="10" fill="#eaeaf2" text-anchor="middle" font-weight="bold">NoSQL</text>
  <line x1="502" y1="250" x2="608" y2="247" stroke="#00c853" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- External API -->
  <rect x="610" y="360" width="130" height="55" rx="2" fill="none" stroke="#00c853" stroke-width="1.5" opacity="0.8"/>
  <rect x="610" y="360" width="130" height="55" rx="2" fill="#00c853" fill-opacity="0.07"/>
  <text x="675" y="380" font-family="monospace" font-size="8" fill="#00c853" text-anchor="middle" letter-spacing="1">EXTERNAL API</text>
  <text x="675" y="398" font-family="monospace" font-size="10" fill="#eaeaf2" text-anchor="middle" font-weight="bold">3rd Party</text>
  <line x1="502" y1="295" x2="608" y2="387" stroke="#00c853" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <!-- Request log panel at bottom -->
  <rect x="60" y="440" width="680" height="45" rx="2" fill="#0a0f1a" stroke="#ff4f1f" stroke-width="1" opacity="0.4"/>
  <text x="80" y="458" font-family="monospace" font-size="8" fill="#00c853">GET</text>
  <text x="110" y="458" font-family="monospace" font-size="8" fill="#8892a4">/api/v1/genesys/config</text>
  <text x="310" y="458" font-family="monospace" font-size="8" fill="#00c853">200</text>
  <text x="340" y="458" font-family="monospace" font-size="8" fill="#4a6890">12ms</text>
  <text x="80" y="474" font-family="monospace" font-size="8" fill="#ff4f1f">POST</text>
  <text x="110" y="474" font-family="monospace" font-size="8" fill="#8892a4">/api/v1/routing/queue</text>
  <text x="310" y="474" font-family="monospace" font-size="8" fill="#00c853">201</text>
  <text x="340" y="474" font-family="monospace" font-size="8" fill="#4a6890">28ms</text>
  <!-- Corner brackets -->
  <g stroke="#00c853" stroke-width="1.5" fill="none" opacity="0.4">
    <polyline points="10,10 10,30 30,30"/>
    <polyline points="790,10 790,30 770,30"/>
    <polyline points="10,490 10,470 30,470"/>
    <polyline points="790,490 790,470 770,470"/>
  </g>
</svg>
