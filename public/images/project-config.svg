  <rect x="250" y="180" width="200" height="60" rx="2" fill="none" stroke="#4a6890" stroke-width="1.2" opacity="0.7"/>
  <rect x="250" y="180" width="200" height="60" rx="2" fill="#4a6890" fill-opacity="0.05"/>
  <text x="350" y="205" font-family="monospace" font-size="9" fill="#4a6890" text-anchor="middle" letter-spacing="1">GCP CLOUD PLATFORM</text>
  <text x="350" y="224" font-family="monospace" font-size="9" fill="#8892a4" text-anchor="middle">Docker · CI/CD Infosys IDP</text>
  <!-- Code editor mock -->
  <rect x="50" y="260" width="330" height="200" rx="3" fill="#0a0f1a" stroke="#ff4f1f" stroke-width="1" opacity="0.6"/>
  <rect x="50" y="260" width="330" height="20" fill="#ff4f1f" fill-opacity="0.1"/>
  <circle cx="65" cy="270" r="4" fill="#e53935" opacity="0.8"/>
  <circle cx="80" cy="270" r="4" fill="#ffb300" opacity="0.8"/>
  <circle cx="95" cy="270" r="4" fill="#00c853" opacity="0.8"/>
  <text x="200" y="273" font-family="monospace" font-size="8" fill="#4a6890" text-anchor="middle">GenesysConfigService.java</text>
  <g transform="translate(65, 295)" font-family="monospace" font-size="9">
    <text fill="#4a6890">01</text><text x="25" fill="#0084d6"> @Service</text>
    <text y="16" fill="#4a6890">02</text><text x="25" y="16" fill="#eaeaf2"> public class <tspan fill="#ff4f1f">GenesysConfigService</tspan> {</text>
    <text y="32" fill="#4a6890">03</text><text x="25" y="32" fill="#8892a4">   // Auto-provision IVR flows</text>
    <text y="48" fill="#4a6890">04</text><text x="25" y="48" fill="#eaeaf2">   <tspan fill="#0084d6">@Autowired</tspan> GenesysCloudApiClient api;</text>
    <text y="64" fill="#4a6890">05</text><text x="25" y="64" fill="#eaeaf2">   <tspan fill="#00c853">public</tspan> Flow createIVRFlow(Config cfg) {</text>
    <text y="80" fill="#4a6890">06</text><text x="25" y="80" fill="#8892a4">     return api.flows().create(cfg);</text>
    <text y="96" fill="#4a6890">07</text><text x="25" y="96" fill="#eaeaf2">   }</text>
    <text y="112" fill="#4a6890">08</text><text x="25" y="112" fill="#eaeaf2">}</text>
  </g>
  <!-- Test coverage -->
  <rect x="420" y="260" width="330" height="200" rx="3" fill="#0a0f1a" stroke="#00c853" stroke-width="1" opacity="0.5"/>
  <text x="585" y="283" font-family="monospace" font-size="9" fill="#00c853" text-anchor="middle" letter-spacing="1">TEST COVERAGE</text>
  <line x1="420" y1="290" x2="750" y2="290" stroke="#00c853" stroke-width="0.5" opacity="0.3"/>
  <g transform="translate(440, 310)">
    <text font-family="monospace" font-size="28" fill="#00c853" font-weight="bold">92%</text>
    <text y="16" font-family="monospace" font-size="8" fill="#4a6890">UNIT TEST COVERAGE</text>
    <text y="50" font-family="monospace" font-size="9" fill="#8892a4">JUnit + Mockito</text>
    <text y="70" font-family="monospace" font-size="9" fill="#8892a4">Integration Tests</text>
    <text y="90" font-family="monospace" font-size="9" fill="#8892a4">CI/CD Pipeline</text>
    <text y="110" font-family="monospace" font-size="28" fill="#ff4f1f" font-weight="bold">3x</text>
    <text y="126" font-family="monospace" font-size="8" fill="#4a6890">FASTER DEPLOYMENT</text>
  </g>
  <!-- Corner brackets -->
  <g stroke="#0084d6" stroke-width="1.5" fill="none" opacity="0.4">
    <polyline points="10,10 10,30 30,30"/>
    <polyline points="790,10 790,30 770,30"/>
    <polyline points="10,490 10,470 30,470"/>
    <polyline points="790,490 790,470 770,470"/>
