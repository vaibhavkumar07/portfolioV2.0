  <rect x="50" y="60" width="150" height="70" rx="2" fill="none" stroke="#0084d6" stroke-width="1.5" opacity="0.8"/>
  <rect x="50" y="60" width="150" height="70" rx="2" fill="#0084d6" fill-opacity="0.07"/>
  <text x="125" y="85" font-family="monospace" font-size="9" fill="#0084d6" text-anchor="middle" letter-spacing="1">FRONTEND</text>
  <text x="125" y="102" font-family="monospace" font-size="11" fill="#eaeaf2" text-anchor="middle" font-weight="bold">React JS</text>
  <text x="125" y="118" font-family="monospace" font-size="8" fill="#4a6890" text-anchor="middle">Configuration UI</text>
  <!-- Arrow right -->
  <line x1="200" y1="95" x2="270" y2="95" stroke="#ff4f1f" stroke-width="1.5" opacity="0.6"/>
  <polygon points="275,95 265,90 265,100" fill="#ff4f1f" opacity="0.6"/>
  <!-- Backend -->
  <rect x="275" y="60" width="150" height="70" rx="2" fill="none" stroke="#ff4f1f" stroke-width="1.5" opacity="0.8"/>
  <rect x="275" y="60" width="150" height="70" rx="2" fill="#ff4f1f" fill-opacity="0.07"/>
