  <text x="350" y="102" font-family="monospace" font-size="11" fill="#eaeaf2" text-anchor="middle" font-weight="bold">Java / Spring Boot</text>
  <text x="350" y="118" font-family="monospace" font-size="8" fill="#4a6890" text-anchor="middle">REST API Layer</text>
  <!-- Arrow right -->
  <line x1="425" y1="95" x2="495" y2="95" stroke="#ff4f1f" stroke-width="1.5" opacity="0.6"/>
  <polygon points="500,95 490,90 490,100" fill="#ff4f1f" opacity="0.6"/>
