  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- Grid -->
  <g opacity="0.05" stroke="#0084d6" stroke-width="0.5">
    <line x1="0" y1="62.5" x2="800" y2="62.5"/><line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="187.5" x2="800" y2="187.5"/><line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="312.5" x2="800" y2="312.5"/><line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="0" y1="437.5" x2="800" y2="437.5"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
