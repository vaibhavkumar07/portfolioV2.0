    <rect x="60" y="-45" width="22" height="45" fill="#ff4f1f" fill-opacity="0.4"/>
    <rect x="90" y="-95" width="22" height="95" fill="#ff4f1f" fill-opacity="0.7"/>
    <rect x="120" y="-70" width="22" height="70" fill="#ff4f1f" fill-opacity="0.5"/>
    <rect x="150" y="-110" width="22" height="110" fill="#ff4f1f" fill-opacity="0.8"/>
    <rect x="180" y="-85" width="22" height="85" fill="#ff4f1f" fill-opacity="0.6"/>
    <rect x="210" y="-100" width="22" height="100" fill="#ff4f1f" fill-opacity="0.75"/>
