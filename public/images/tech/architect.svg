<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#050810"/>
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="rgba(255,79,31,0.25)" stroke-width="1"/>
  <circle cx="8" cy="8" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="248" cy="8" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="8" cy="248" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="248" cy="248" r="3" fill="rgba(255,79,31,0.4)"/>
  <text x="128" y="30" font-family="monospace" font-size="9" fill="rgba(255,79,31,0.5)" text-anchor="middle" letter-spacing="3">ARCHITECT</text>
  <!-- Flow diagram -->
  <g transform="translate(128,130)">
    <!-- Start node -->
    <rect x="-35" y="-90" width="70" height="28" rx="14" fill="#ff4f1f" fill-opacity="0.15" stroke="#ff4f1f" stroke-width="1.5"/>
    <text x="0" y="-71" font-family="monospace" font-size="9" fill="#ff4f1f" text-anchor="middle">START</text>
    <!-- Arrow down -->
    <line x1="0" y1="-62" x2="0" y2="-44" stroke="#ff4f1f" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-42 -5,-52 5,-52" fill="#ff4f1f" opacity="0.6"/>
    <!-- Decision diamond -->
    <polygon points="0,-42 42,-20 0,2 -42,-20" fill="#ff4f1f" fill-opacity="0.08" stroke="#ff4f1f" stroke-width="1.5"/>
    <text x="0" y="-15" font-family="monospace" font-size="8" fill="#ff4f1f" text-anchor="middle">IVR MENU</text>
    <!-- Left branch -->
    <line x1="-42" y1="-20" x2="-70" y2="-20" stroke="#0084d6" stroke-width="1.2" opacity="0.6"/>
    <line x1="-70" y1="-20" x2="-70" y2="22" stroke="#0084d6" stroke-width="1.2" opacity="0.6"/>
    <rect x="-95" y="22" width="50" height="22" rx="3" fill="#0084d6" fill-opacity="0.12" stroke="#0084d6" stroke-width="1.2"/>
    <text x="-70" y="37" font-family="monospace" font-size="7" fill="#0084d6" text-anchor="middle">Press 1</text>
    <!-- Center branch -->
    <line x1="0" y1="2" x2="0" y2="22" stroke="#00c853" stroke-width="1.2" opacity="0.6"/>
    <rect x="-25" y="22" width="50" height="22" rx="3" fill="#00c853" fill-opacity="0.12" stroke="#00c853" stroke-width="1.2"/>
    <text x="0" y="37" font-family="monospace" font-size="7" fill="#00c853" text-anchor="middle">Press 2</text>
    <!-- Right branch -->
    <line x1="42" y1="-20" x2="70" y2="-20" stroke="#ff4f1f" stroke-width="1.2" opacity="0.6"/>
    <line x1="70" y1="-20" x2="70" y2="22" stroke="#ff4f1f" stroke-width="1.2" opacity="0.6"/>
    <rect x="45" y="22" width="50" height="22" rx="3" fill="#ff4f1f" fill-opacity="0.12" stroke="#ff4f1f" stroke-width="1.2"/>
    <text x="70" y="37" font-family="monospace" font-size="7" fill="#ff4f1f" text-anchor="middle">Press 3</text>
    <!-- Agent box -->
    <line x1="0" y1="44" x2="0" y2="62" stroke="#ff4f1f" stroke-width="1.2" opacity="0.5"/>
    <rect x="-38" y="62" width="76" height="26" rx="3" fill="#ff4f1f" fill-opacity="0.2" stroke="#ff4f1f" stroke-width="2"/>
    <text x="0" y="79" font-family="monospace" font-size="8" fill="#ff4f1f" text-anchor="middle">● AGENT</text>
  </g>
  <text x="128" y="232" font-family="monospace" font-size="8" fill="rgba(255,79,31,0.4)" text-anchor="middle" letter-spacing="2">FLOW DESIGNER</text>
</svg>
