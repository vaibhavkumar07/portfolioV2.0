<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#050810"/>
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="rgba(255,79,31,0.2)" stroke-width="1"/>
  <circle cx="8" cy="8" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="248" cy="8" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="8" cy="248" r="3" fill="rgba(255,79,31,0.4)"/>
  <circle cx="248" cy="248" r="3" fill="rgba(255,79,31,0.4)"/>
  <text x="128" y="30" font-family="monospace" font-size="9" fill="rgba(255,79,31,0.5)" text-anchor="middle" letter-spacing="3">DIALOGFLOW</text>
  <!-- Speech bubble with waveform -->
  <g transform="translate(128,120)">
    <!-- Main speech bubble -->
    <rect x="-62" y="-52" width="124" height="80" rx="16" fill="#ff4f1f" fill-opacity="0.12" stroke="#ff4f1f" stroke-width="2"/>
    <!-- Bubble tail -->
    <polygon points="-16,28 -40,55 8,28" fill="#ff4f1f" fill-opacity="0.12" stroke="#ff4f1f" stroke-width="2" stroke-linejoin="round"/>
    <!-- Waveform inside bubble -->
    <polyline points="-48,-12 -38,-28 -28,-8 -18,-32 -8,-16 2,-36 12,-8 22,-28 32,-12 42,-24 52,-12" fill="none" stroke="#ff4f1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- NLP label -->
    <text x="0" y="75" font-family="monospace" font-size="9" fill="#ff4f1f" text-anchor="middle">● NLP · 94%</text>
    <!-- Orbit ring -->
    <circle cx="0" cy="-12" r="72" fill="none" stroke="#ff4f1f" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,4"/>
  </g>
  <text x="128" y="232" font-family="monospace" font-size="8" fill="rgba(255,79,31,0.4)" text-anchor="middle" letter-spacing="2">VOICEBOT · CHATBOT</text>
</svg>
