<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#050810"/>
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="8" cy="8" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="248" cy="8" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="8" cy="248" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="248" cy="248" r="3" fill="rgba(255,255,255,0.3)"/>
  <text x="128" y="30" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="3">OPENAI</text>
  <!-- OpenAI flower/spiral logo approximation -->
  <g transform="translate(128,128)">
    <circle r="68" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- 6-petal rotating shape -->
    <g opacity="0.85">
      <ellipse rx="22" ry="52" fill="none" stroke="white" stroke-width="2.5" transform="rotate(0)"/>
      <ellipse rx="22" ry="52" fill="none" stroke="white" stroke-width="2.5" transform="rotate(60)"/>
      <ellipse rx="22" ry="52" fill="none" stroke="white" stroke-width="2.5" transform="rotate(120)"/>
    </g>
    <!-- Inner glow -->
    <circle r="14" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <circle r="6" fill="white" opacity="0.9"/>
  </g>
  <text x="128" y="232" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="2">GPT · AI STUDIO</text>
</svg>
